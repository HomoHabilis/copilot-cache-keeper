name: Smoke test

# One run per change: pushes to main, and pull requests (which cover their branch's pushes).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:      # reused by the release workflow before publishing

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # tags, for the build's version

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          node --check extension.js
          node --check core.js
          node --check sqlite.js
          node --check harnesses.js
          for f in test/live/check.js test/live/plan.js test/live/driver/extension.js; do node --check "$f"; done
          bash -n test/live/run.sh
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Smoke test (core logic + extension with a stand-in VS Code)
        run: node test/smoke.js

      - name: Build the .vsix
        env:
          # a pull request is checked out as a merge commit: version it after the PR's own commit
          COMMIT: ${{ github.event.pull_request.head.sha }}
          # only goes up, so each build installs over the previous one
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 build.py

      - name: Check the .vsix contents
        run: |
          set -e
          VSIX=$(ls copilot-cache-keeper-*.vsix)
          python3 - "$VSIX" <<'EOF'
          import base64, json, pathlib, re, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = set(z.namelist())
          need = {"[Content_Types].xml", "extension.vsixmanifest", "extension/package.json",
              "extension/extension.js", "extension/core.js", "extension/sqlite.js", "extension/harnesses.js",
              "extension/README.md", "extension/README-offline.md"}
          missing = need - names
          assert not missing, f"missing in vsix: {missing}"
          pkg = json.loads(z.read("extension/package.json"))
          manifest = z.read("extension.vsixmanifest").decode()
          assert f'Version="{pkg["version"]}"' in manifest, "manifest version differs from package.json"
          assert pkg["main"] == "./extension.js"
          readme = z.read("extension/README-offline.md").decode()
          source = pathlib.Path("README.md").read_text(encoding="utf-8")
          details = z.read("extension/README.md").decode()
          assert not re.search(r'!\[[^\]]*\]\(', details), "images cannot load in the extension Details tab"
          assert "Cache Keeper: Documentation" in details
          pattern = r'!\[([^\]]*)\]\(([^)]+)\)'
          source_images = re.findall(pattern, source)
          images = re.findall(pattern, readme)
          assert images and len(images) == len(source_images), "README images missing"
          for (source_alt, source_path), (alt, image) in zip(source_images, images):
              assert alt == source_alt, "README image caption changed"
              assert image.startswith("data:image/png;base64,"), "README image must be embedded"
              assert base64.b64decode(image.split(",", 1)[1], validate=True) == pathlib.Path(source_path).read_bytes(), source_path
          print(f"{sys.argv[1]}: {len(names)} files, version {pkg['version']}, OK")
          EOF

      # Download it from the run's Summary page (Artifacts) to try a pull request's build.
      - name: Upload the .vsix
        uses: actions/upload-artifact@v6
        with:
          name: copilot-cache-keeper-vsix
          path: copilot-cache-keeper-*.vsix
          if-no-files-found: error
          retention-days: 14
