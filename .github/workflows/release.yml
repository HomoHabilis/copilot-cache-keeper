name: Release

# Run from the Actions tab ("Run workflow"):
#  - to release an existing tag: pick it in "Use workflow from" (leave "tag" empty);
#  - to create a new tag: stay on a branch and type the tag (e.g. v0.7.6); it is created on that
#    branch's latest commit;
#  - with both empty: the tag is "v" + the version in package.json.
# The .vsix is built with the tag's version number and attached to a GitHub release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v0.7.6). Leave empty to release the tag selected in 'Use workflow from', or v<package.json version>."
        required: false
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  smoke:
    uses: ./.github/workflows/ci.yml

  release:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          if ! echo "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$TAG' is not a version like v1.2.3"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Using existing tag $TAG"; echo "create=false" >> "$GITHUB_OUTPUT"
            git checkout -q "refs/tags/$TAG"
          else
            echo "Creating tag $TAG on $(git rev-parse --short HEAD) ($REF_NAME)"; echo "create=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build the .vsix with the tag's version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f));p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          python3 build.py
          ls -l copilot-cache-keeper-*.vsix

      - name: Create the tag (if new) and the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          CREATE: ${{ steps.tag.outputs.create }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -e
          if [ "$CREATE" = "true" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          [ "$PRERELEASE" = "true" ] && PRE="--prerelease" || PRE=""
          gh release create "$TAG" "copilot-cache-keeper-$VERSION.vsix" \
            --title "Copilot Cache Keeper $TAG" --generate-notes $PRE \
            --notes "Install: download copilot-cache-keeper-$VERSION.vsix, then run \`code --install-extension copilot-cache-keeper-$VERSION.vsix\` on the machine where VS Code runs (or Extensions → … → Install from VSIX), and reload the windows."
